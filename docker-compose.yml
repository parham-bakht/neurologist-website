services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neurologist
      POSTGRES_USER: neurologist
      POSTGRES_PASSWORD: neurologist
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurologist -d neurologist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
